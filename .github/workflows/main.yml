name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spotifyhud
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.8.2
      - run: gradle build
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: spotifyhud/build/libs/
      - name: Publish jar as a release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^mod_version' spotifyhud/gradle.properties | cut -d= -f2)
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" spotifyhud/build/libs/spotifyhud-$V.jar --title "spotifyhud $V" --notes "Built automatically"
